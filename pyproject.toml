[project]
name = "signalforge"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: real-browser Playwright tests (need a browser)"]
addopts = "-m 'not e2e'"
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E702", "E701", "E402", "E731", "E501"]
