plugins { id 'com.android.application' }
android {
    namespace 'app.signalforge.decisionos'
    compileSdk 34
    defaultConfig {
        applicationId 'app.signalforge.decisionos'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'signalforge'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
