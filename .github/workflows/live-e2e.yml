name: live-e2e
on:
  workflow_dispatch:
    inputs:
      url:
        description: Deployed app URL
        default: https://signalforge-decision-os.streamlit.app
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - name: Full journey against the LIVE deployment (downloads, save/restore, malformed + empty upload, isolated 2nd session)
        env:
          SF_E2E_URL: ${{ inputs.url }}
        shell: bash
        run: set -o pipefail; pytest -q -m e2e tests/e2e -p no:cacheprovider --tb=short | tee live-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-e2e, path: "live-e2e.log\ndocs/screenshots/" }
